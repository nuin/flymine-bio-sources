# InterMine loader merge keys for the flybase-protein-symbol bio-source.
# Protein items are merged on secondaryIdentifier (FBpp uniquename, which
# chado-db-flybase-dmel already set on the Protein rows); only symbol is
# added on top. NOTE: this source deliberately merges on secondaryIdentifier
# (not the global Protein primaryIdentifier=UniProt accession key) because
# FlyBase precomputed files key proteins by FBpp.

DataSet.key     = name
DataSource.key  = name
Organism.key    = taxonId
Protein.key     = secondaryIdentifier
