# InterMine loader merge keys for the flybase-human-orthologs bio-source.
# Fly Gene items merge on primaryIdentifier (FBgn) with the chado-loaded
# Dmel Gene rows. Human Gene stubs merge on primaryIdentifier (HGNC id, or
# the human symbol when no HGNC id is present) so repeated human targets
# across rows collapse to one stub. Homologue items are always created new.

DataSet.key     = name
DataSource.key  = name
Organism.key    = taxonId
Gene.key        = primaryIdentifier
