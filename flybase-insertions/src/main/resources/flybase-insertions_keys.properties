# InterMine loader merge keys for flybase-insertions.
# TransposableElementInsertionSite items will merge with any FBti rows already
# loaded by other sources (none in Phase 2 round 3 — chado-db-flybase-dmel
# doesn't currently emit FBti). Chromosome merges by primaryIdentifier with
# the chromosomes that chado created.

DataSet.key                          = name
DataSource.key                       = name
Organism.key                         = taxonId
TransposableElementInsertionSite.key = primaryIdentifier
Chromosome.key                       = primaryIdentifier
