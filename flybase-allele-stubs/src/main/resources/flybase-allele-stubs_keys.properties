# InterMine loader merge keys for the flybase-allele-stubs bio-source.
# Items merge into existing chado-loaded Allele/Gene rows by primaryIdentifier;
# new Allele stubs for FBals not in chado (transgene-vector alleles tagged
# with their source organism in chado) become fresh rows.

DataSet.key      = name
DataSource.key   = name
Organism.key     = taxonId
Gene.key         = primaryIdentifier
Allele.key       = primaryIdentifier
