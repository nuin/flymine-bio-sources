# InterMine loader merge keys for flybase-transgenic-constructs.
# Constructs merge by FBtp primaryIdentifier. Gene refs merge by FBgn into
# chado-loaded genes. TransposableElementInsertionSite refs merge by FBti
# into flybase-insertions-loaded items (which is why flybase-transgenic-
# constructs must run AFTER flybase-insertions in project.xml).

DataSet.key                          = name
DataSource.key                       = name
Organism.key                         = taxonId
Gene.key                             = primaryIdentifier
TransgenicConstruct.key              = primaryIdentifier
TransposableElementInsertionSite.key = primaryIdentifier
