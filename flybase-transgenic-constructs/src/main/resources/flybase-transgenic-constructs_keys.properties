# InterMine loader merge keys for flybase-transgenic-constructs.
# Updated 2026-06-05 for the 17-col allele-centric rewrite — the converter
# now creates Allele stubs (col 2 FBal) in addition to TransgenicConstruct
# and Gene items, all merging by primaryIdentifier into chado-loaded data.

DataSet.key             = name
DataSource.key          = name
Organism.key            = taxonId
Gene.key                = primaryIdentifier
Allele.key              = primaryIdentifier
TransgenicConstruct.key = primaryIdentifier
