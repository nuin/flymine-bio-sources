# InterMine loader merge keys for the flybase-aberrations bio-source.
# Without these the loader cannot merge Aberration/Balancer/Gene items
# with rows already loaded by chado-db-flybase-dmel.

DataSet.key      = name
DataSource.key   = name
Organism.key     = taxonId
Gene.key         = primaryIdentifier
Allele.key       = primaryIdentifier
Aberration.key   = primaryIdentifier
Balancer.key     = primaryIdentifier
