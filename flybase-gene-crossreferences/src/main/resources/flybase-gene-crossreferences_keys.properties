# InterMine loader merge keys for the flybase-gene-crossreferences bio-source.
# Gene items are merged on primaryIdentifier (FBgn) with the chado-loaded
# Gene rows; CrossReference + DataSource items are always created new and
# attached to the merged Gene via CrossReference.subject (reverse-reference
# Gene.crossReferences).

DataSet.key     = name
DataSource.key  = name
Organism.key    = taxonId
Gene.key        = primaryIdentifier

# 2026-09-09: subject-inclusive key so shared accessions across genes do NOT collide
CrossReference.key = subject, identifier, source
